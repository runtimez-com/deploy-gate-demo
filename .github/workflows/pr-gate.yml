name: deployment-risk
on: pull_request
permissions:
  pull-requests: write   # sticky PR comment
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base-src
      - name: Changed files
        run: git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
      - name: Deployment risk gate
        uses: ./.github/actions/deployment-risk
        with:
          manifests: k8s
          baseline-manifests: base-src/k8s
          changed-files: changed.txt
          fail-on: HIGH
          # secrets, not vars: a public run log prints a step's `with:` values unmasked
          runtimez-url: ${{ secrets.RUNTIMEZ_URL }}
          api-key: ${{ secrets.RUNTIMEZ_API_KEY }}
          org-id: ${{ secrets.RUNTIMEZ_ORG_ID }}
          cluster-id: ${{ secrets.RUNTIMEZ_CLUSTER_ID }}
