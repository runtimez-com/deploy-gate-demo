# fires on 1.16.3: apiCall into another namespace (clamp since 1.16.3)
apiVersion: kyverno.io/v1
kind: Policy
metadata: {name: scn-s3b-apicall, namespace: scn-kyverno}
spec:
  validationFailureAction: Enforce
  rules:
  - name: check
    match:
      any:
      - resources: {kinds: [ConfigMap]}
    context:
    - name: shared
      apiCall: {urlPath: "/api/v1/namespaces/kube-system/configmaps"}
    validate:
      message: "blocked"
      deny:
        conditions:
          any:
          - {key: "{{ length(shared.items) }}", operator: LessThan, value: 0}
---
# silent: its own namespace
apiVersion: kyverno.io/v1
kind: Policy
metadata: {name: scn-s3b-own, namespace: scn-kyverno}
spec:
  validationFailureAction: Audit
  rules:
  - name: check
    match:
      any:
      - resources: {kinds: [ConfigMap]}
    context:
    - name: mine
      apiCall: {urlPath: "/api/v1/namespaces/scn-kyverno/configmaps"}
    validate:
      message: "m"
      deny:
        conditions:
          any:
          - {key: "{{ length(mine.items) }}", operator: LessThan, value: 0}
---
# silent on 1.16.3: configMap clamp starts at 1.16.4
apiVersion: kyverno.io/v1
kind: Policy
metadata: {name: scn-s3b-configmap, namespace: scn-kyverno}
spec:
  validationFailureAction: Audit
  rules:
  - name: check
    match:
      any:
      - resources: {kinds: [ConfigMap]}
    context:
    - name: settings
      configMap: {name: kyverno-settings, namespace: default}
    validate:
      message: "m"
      pattern: {metadata: {name: "?*"}}
---
# silent on 1.16.3: CEL http off from 1.16.4
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata: {name: scn-s3b-http, namespace: scn-kyverno}
spec:
  validationActions: [Audit]
  matchConstraints:
    resourceRules:
    - {apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [configmaps]}
  validations:
  - expression: 'http.Get("https://allow.example/check").allowed == true'
---
# silent on 1.16.3: the generation-label webhook starts at 1.19.2
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scn-s3b-generated
  namespace: scn-kyverno
  labels: {generate.kyverno.io/policy-name: scn-ns-generate, generate.kyverno.io/rule-name: gen, app.kubernetes.io/managed-by: kyverno}
spec: {podSelector: {}, policyTypes: [Ingress]}
