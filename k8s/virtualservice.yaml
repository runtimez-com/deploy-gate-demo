apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: gate-web
  namespace: rtz-gate-demo
spec:
  hosts: [gate-web.rtz-gate-demo.svc.cluster.local]
  http:
    - fault:
        abort:
          percentage: {value: 100}
          httpStatus: 503
      route:
        - destination:
            host: gate-web.rtz-gate-demo.svc.cluster.local
            port: {number: 80}
