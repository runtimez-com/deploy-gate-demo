apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gate-web-l7
  namespace: rtz-gate-demo
spec:
  endpointSelector:
    matchLabels: {app: gate-web}
  ingress:
    - fromEndpoints:
        - matchLabels: {"k8s:io.kubernetes.pod.namespace": rtz-gate-demo}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - {method: GET, path: "/.*"}
    - fromEntities: [world]
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
