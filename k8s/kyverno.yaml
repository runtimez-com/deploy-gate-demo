apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: scn-pr-audit-to-enforce}
spec:
  validationFailureAction: Enforce
  rules:
  - name: check
    match:
      any:
      - resources: {kinds: [Pod], namespaces: [scn-kyverno], selector: {matchLabels: {app: scn-other}}}
    validate:
      message: team label required
      pattern: {metadata: {labels: {team: "?*"}}}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: scn-pr-weaken}
spec:
  validationFailureAction: Audit
  rules:
  - name: check
    match:
      any:
      - resources: {kinds: [Pod], namespaces: [scn-pr-none], selector: {matchLabels: {app: scn-pr-none}}}
    validate:
      message: team label required
      pattern: {metadata: {labels: {team: "?*"}}}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: scn-pr-failure}
spec:
  validationFailureAction: Audit
  rules:
  - name: check
    match:
      any:
      - resources: {kinds: [Pod], namespaces: [scn-pr-none], selector: {matchLabels: {app: scn-pr-none}}}
    validate:
      message: team label required
      pattern: {metadata: {labels: {team: "?*"}}}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: scn-pr-mutate-existing}
spec:
  mutateExistingOnPolicyUpdate: true
  rules:
  - name: label-secrets
    match: {any: [{resources: {kinds: [ConfigMap], namespaces: [scn-pr-none]}}]}
    mutate:
      targets: [{apiVersion: v1, kind: Secret, namespace: scn-pr-none}]
      patchStrategicMerge: {metadata: {labels: {scn: pr}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: scn-pr-control, namespace: scn-kyverno}
spec:
  selector: {matchLabels: {app: scn-pr-control}}
  template:
    metadata: {labels: {app: scn-pr-control}}
    spec: {containers: [{name: pause, image: "registry.k8s.io/pause:3.9"}]}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: scn-pr-new-enforce}
spec:
  validationFailureAction: Enforce
  rules:
  - name: check
    match:
      any:
      - resources: {kinds: [Pod], namespaces: [scn-kyverno], selector: {matchLabels: {app: scn-web}}}
    validate:
      message: team label required
      pattern: {metadata: {labels: {team: "?*"}}}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: scn-pr-audit-clean}
spec:
  validationFailureAction: Audit
  rules:
  - name: check
    match:
      any:
      - resources: {kinds: [Pod], namespaces: [scn-kyverno], selector: {matchLabels: {app: scn-web}}}
    validate:
      message: team label required
      pattern: {metadata: {labels: {team: "?*"}}}
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata: {name: scn-pr-exempt-web, namespace: scn-kyverno}
spec:
  exceptions: [{policyName: scn-pr-new-enforce, ruleNames: [check]}]
  match:
    any:
    - resources: {kinds: [Pod], namespaces: [scn-kyverno], selector: {matchLabels: {app: scn-web}}}
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata: {name: scn-pr-exempt-missing, namespace: scn-kyverno}
spec:
  exceptions: [{policyName: scn-pr-missing, ruleNames: [check]}]
  match:
    any:
    - resources: {kinds: [Pod], namespaces: [scn-kyverno], selector: {matchLabels: {app: scn-web}}}
---
apiVersion: kyverno.io/v2
kind: CleanupPolicy
metadata: {name: scn-pr-sweep, namespace: scn-kyverno}
spec:
  schedule: "*/30 * * * *"
  match:
    any:
    - resources: {kinds: [Pod]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: scn-pr-ttl, namespace: scn-kyverno}
spec:
  selector: {matchLabels: {app: scn-pr-ttl}}
  template:
    metadata: {labels: {app: scn-pr-ttl, cleanup.kyverno.io/ttl: 2h}}
    spec: {containers: [{name: pause, image: "registry.k8s.io/pause:3.9"}]}
