# TLS for gate-web through cert-manager: a self-signed Issuer and the Certificate that writes Secret gate-web-tls.
# No Ingress: rtz-eks runs no ingress-nginx controller, so an nginx Ingress never gets an address and Argo CD keeps the app Progressing.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: demo-selfsigned, namespace: rtz-gate-demo}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: gate-web-tls, namespace: rtz-gate-demo}
spec:
  secretName: gate-web-tls
  dnsNames: [gate-web.rtz-gate-demo.example.com]
  issuerRef: {name: demo-selfsigned, kind: Issuer}
  privateKey: {algorithm: RSA, size: 2048}
